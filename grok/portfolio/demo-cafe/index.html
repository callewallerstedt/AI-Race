<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kafferosteriet Havsbris — demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #14201c;
      --foam: #f3efe7;
      --bean: #c9842f;
      --mist: #9bb0a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--foam); font-family: Manrope, sans-serif;
      background:
        linear-gradient(180deg, rgba(20,32,28,0.35), rgba(20,32,28,0.82)),
        radial-gradient(circle at 30% 20%, #3a4f45, #14201c 55%);
      min-height: 100vh;
    }
    .shell { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }
    .brand { font-family: "DM Serif Display", serif; font-size: 1.5rem; }
    .hero { padding: 4.5rem 0 2rem; max-width: 18ch; }
    h1 {
      font-family: "DM Serif Display", serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 0.95; margin: 0 0 1rem;
      animation: in 800ms ease both;
    }
    p { color: var(--mist); font-size: 1.1rem; max-width: 34ch; animation: in 950ms ease both; }
    .btn {
      display: inline-block; margin-top: 1.4rem; background: var(--bean); color: #1a1208;
      text-decoration: none; font-weight: 700; padding: 0.85rem 1.2rem; border-radius: 999px;
      animation: in 1100ms ease both;
    }
    .panel {
      margin-top: 2rem; border: 1px solid rgba(243,239,231,0.15); padding: 1.25rem;
      backdrop-filter: blur(4px); animation: in 1200ms ease both;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .banner {
      position: fixed; inset: auto 0 0 0; background: #0c1411; color: var(--foam);
      text-align: center; padding: 0.55rem; font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">Havsbris</div>
    <header class="hero">
      <h1>Rostat vid kusten.</h1>
      <p>En enda landningssida för en lokal rosteri-idé: varumärke först, ett löfte, en beställningsknapp.</p>
      <a class="btn" href="#bestall">Beställ provpåse</a>
    </header>
    <section class="panel" id="bestall">
      <strong>Provpåse 250 g</strong>
      <p style="margin:0.4rem 0 0">Demo-CTA. I skarp leverans: Swish-länk, lagerstatus eller Stripe Checkout.</p>
    </section>
  </div>
  <div class="banner">DEMO — Grok AI Race portfolio sample · not a live business</div>
</body>
</html>
